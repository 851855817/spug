name: Baota module checks

on:
  push:
    branches: [feature/baota-panel-tasks]
  pull_request:
    paths:
      - 'spug_api/apps/baota/**'
      - 'spug_api/spug/test_*.py'
      - 'spug_web/src/pages/baota/**'
      - 'spug_web/src/pages/exec/panel/**'
      - '.github/workflows/baota-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baota-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Pull fixed production runtime
        run: docker pull ghcr.io/openspug/spug@sha256:13fe7c547932e9479dc8181648ec257b91a18e941ef3f2687d9aeb79882de90c
      - name: Run all Baota tests in isolation
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=128m \
            --memory 768m --cpus 2 --pids-limit 128 \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONUNBUFFERED=1 \
            -v "$GITHUB_WORKSPACE:/source:ro" --workdir /source/spug_api \
            --entrypoint python3 \
            ghcr.io/openspug/spug@sha256:13fe7c547932e9479dc8181648ec257b91a18e941ef3f2687d9aeb79882de90c \
            manage.py test apps.baota --settings=spug.test_settings --noinput
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spug_web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: spug_web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run module helper tests
        env:
          CI: 'true'
          NODE_OPTIONS: --openssl-legacy-provider
        run: node node_modules/react-app-rewired/bin/index.js test --watch=false --runInBand --testPathPattern='pages/(baota|exec/panel)/.*test.js' --passWithNoTests
      - name: Build production assets
        env:
          CI: 'false'
          NODE_OPTIONS: --openssl-legacy-provider
          GENERATE_SOURCEMAP: 'false'
        run: node node_modules/react-app-rewired/bin/index.js build
