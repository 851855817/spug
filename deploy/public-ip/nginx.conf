# Host-only ingress. Keep the Docker mapping on 127.0.0.1:8080.
map $http_upgrade $spug_public_connection {
    default upgrade;
    '' close;
}

# Spug WebSockets carry tokens in query parameters. Do not log queries.
log_format spug_public_no_query '$remote_addr [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80 default_server;
    server_name 47.104.88.147;
    server_tokens off;
    access_log /var/log/nginx/spug-public-access.log spug_public_no_query;
    error_log /var/log/nginx/spug-public-error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/spug-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://47.104.88.147$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name 47.104.88.147;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/spug-public-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spug-public-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SpugPublicTLS:1m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/spug-public-access.log spug_public_no_query;
    error_log /var/log/nginx/spug-public-error.log crit;
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host 47.104.88.147;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $spug_public_connection;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_request_buffering off;

    location ^~ /api/ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
