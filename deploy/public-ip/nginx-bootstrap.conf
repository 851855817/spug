# Initial ACME connectivity only. Do not serve the application over cleartext.
log_format spug_public_no_query '$remote_addr [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80 default_server;
    server_name 47.104.88.147;
    server_tokens off;
    access_log /var/log/nginx/spug-public-access.log spug_public_no_query;
    error_log /var/log/nginx/spug-public-error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/spug-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /_spug_public_probe {
        default_type text/plain;
        return 200 "spug-public-ip-ready\n";
    }

    location / {
        return 404;
    }
}
