
[program:spug-panel-worker]
directory = /data/spug/spug_api
command = python3 manage.py runpanelworker --parallel 2
autostart = true
autorestart = true
startsecs = 3
stopsignal = TERM
stopwaitsecs = 35
stopasgroup = true
killasgroup = true
stdout_logfile = /data/spug/spug_api/logs/panel-worker.log
stdout_logfile_maxbytes = 5MB
stdout_logfile_backups = 3
redirect_stderr = true
